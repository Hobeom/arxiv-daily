# Temporary: diagnose S2_API_KEY rejections (prints only codes, a short
# hash prefix and character classes, never the key). Remove before merging.
name: Branch probe (S2 key)

on:
  push:
    branches: [claude/error-check-layout-update-89ys3h]
    paths: ['.github/workflows/branch-probe-s2key.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          import hashlib, json, os, time, urllib.request
          raw = os.environ.get('S2_API_KEY', '')
          key = raw.strip()
          print('length raw/stripped:', len(raw), len(key), '| sha256 prefix:', hashlib.sha256(key.encode()).hexdigest()[:8])
          print('alnum only:', key.isalnum(), '| has whitespace inside:', any(c.isspace() for c in key), '| quotes:', any(c in '"\'' for c in key))
          def call(url, data=None, use_key=True):
              h = {'User-Agent': 'arxiv-daily-probe/1.0', 'Content-Type': 'application/json'}
              if use_key:
                  h['x-api-key'] = key
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data else None, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return r.status, r.read()[:100]
              except urllib.error.HTTPError as e:
                  return e.code, e.read()[:150]
          B = 'https://api.semanticscholar.org'
          for name, url, data in [
              ('graph paper', f'{B}/graph/v1/paper/arXiv:2609.18487?fields=title', None),
              ('graph search', f'{B}/graph/v1/paper/search?query=robot&limit=1', None),
              ('batch', f'{B}/graph/v1/paper/batch?fields=title', {'ids': ['arXiv:2609.18487']}),
              ('recs', f'{B}/recommendations/v1/papers/forpaper/arXiv:2609.18487?limit=3', None),
          ]:
              print(name, 'with key ->', *call(url, data))
              time.sleep(1.2)
          print('graph paper without key ->', *call(f'{B}/graph/v1/paper/arXiv:2609.18487?fields=title', use_key=False))
