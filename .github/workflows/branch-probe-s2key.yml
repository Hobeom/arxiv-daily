# Temporary: confirm S2_API_KEY works (prints only status codes). Remove before merging.
name: Branch probe (S2 key)

on:
  push:
    branches: [claude/error-check-layout-update-89ys3h]
    paths: ['.github/workflows/branch-probe-s2key.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
        run: |
          import os, time, urllib.request, json, collections
          key = os.environ.get('S2_API_KEY', '')
          print('S2_API_KEY:', 'SET' if key else 'not set', '| length', len(key))
          ids = ['2609.18487', '2610.09455', '2610.12069', '2610.10539', '2609.17099', '2608.23478', '2607.21670', '2610.00899', '2609.25820', '2610.04009']
          codes = collections.Counter(); t0 = time.time()
          for i in ids:
              req = urllib.request.Request(f'https://api.semanticscholar.org/recommendations/v1/papers/forpaper/arXiv:{i}?limit=10&fields=externalIds',
                                           headers={'x-api-key': key, 'User-Agent': 'arxiv-daily-probe/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      n = len(json.loads(r.read()).get('recommendedPapers', [])); codes[r.status] += 1
                      print(i, r.status, n, 'recs')
              except urllib.error.HTTPError as e:
                  codes[e.code] += 1; print(i, e.code, e.read()[:120])
              time.sleep(1.1)
          print('status counts', dict(codes), 'elapsed %.1fs' % (time.time() - t0))
