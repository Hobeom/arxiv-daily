# Temporary: runs the full pipeline on this feature branch once to prefill
# arxiv/meta.json and verify the daily run. Remove before merging.
name: Branch verify (daily + explorer backfill)

on:
  push:
    branches: [claude/error-check-layout-update-89ys3h]
    paths: ['.github/workflows/branch-verify.yml']

permissions:
  contents: write

env:
  GITHUB_USER_NAME: HoBeom
  GITHUB_USER_EMAIL: jhb1365@gmail.com

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python Env
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily arxiv
        run: |
          python daily_arxiv.py

      - name: Build explorer data (backfill abstracts)
        run: |
          python build_explorer.py
          python -c "import json; m=json.load(open('arxiv/meta.json')); d=json.load(open('docs/data.json')); n=sum(1 for p in d['papers'] if p['abstract']); print('meta', len(m), 'papers', len(d['papers']), 'with abstract', n)"

      - name: Commit results
        uses: github-actions-x/commit@v2.9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "data: prefill arxiv/meta.json and explorer data"
          rebase: 'true'
          name: ${{ env.GITHUB_USER_NAME }}
          email: ${{ env.GITHUB_USER_EMAIL }}
