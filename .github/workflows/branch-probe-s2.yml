# Temporary: check for a Semantic Scholar key and probe S2 API responses.
# Prints only whether secrets are set, never their values. Remove before merging.
name: Branch probe (Semantic Scholar)

on:
  push:
    branches: [claude/error-check-layout-update-89ys3h]
    paths: ['.github/workflows/branch-probe-s2.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        shell: python
        env:
          K1: ${{ secrets.S2_API_KEY }}
          K2: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          K3: ${{ secrets.SEMANTIC_SCHOLAR_KEY }}
          K4: ${{ secrets.S2_KEY }}
          K5: ${{ secrets.SS_API_KEY }}
        run: |
          import json, os, time, urllib.request
          names = {'K1': 'S2_API_KEY', 'K2': 'SEMANTIC_SCHOLAR_API_KEY', 'K3': 'SEMANTIC_SCHOLAR_KEY', 'K4': 'S2_KEY', 'K5': 'SS_API_KEY'}
          key = None
          for k, n in names.items():
              v = os.environ.get(k, '')
              print(f'secret {n}: {"SET" if v else "not set"}')
              if v and not key:
                  key = v
          def call(url, data=None, use_key=True):
              h = {'User-Agent': 'arxiv-daily-probe/1.0', 'Content-Type': 'application/json'}
              if key and use_key:
                  h['x-api-key'] = key
              req = urllib.request.Request(url, data=json.dumps(data).encode() if data else None, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode('utf-8', 'replace')[:300]
              except Exception as e:
                  return -1, repr(e)
          ids = ['2609.18487', '2610.09455', '2610.12069', '2604.01000']
          B = 'https://api.semanticscholar.org'
          code, j = call(f'{B}/graph/v1/paper/batch?fields=externalIds,title,year,publicationDate,referenceCount,citationCount,references.externalIds,citations.externalIds',
                         {'ids': [f'arXiv:{i}' for i in ids]})
          print('batch', code)
          if code == 200:
              for i, p in zip(ids, j):
                  if not p:
                      print(' ', i, 'NOT FOUND'); continue
                  refs = [r.get('externalIds') or {} for r in p.get('references') or []]
                  cites = [r.get('externalIds') or {} for r in p.get('citations') or []]
                  print(' ', i, p.get('title', '')[:60], '| refs', p.get('referenceCount'), len(refs), 'arxiv refs', sum('ArXiv' in r for r in refs),
                        '| cites', p.get('citationCount'), len(cites), 'arxiv cites', sum('ArXiv' in r for r in cites))
                  print('    sample ref ids:', [r.get('ArXiv') for r in refs if 'ArXiv' in r][:5])
                  print('    keys:', list(p.keys()))
          else:
              print(j)
          time.sleep(1.5)
          for i in ids[:2]:
              code, j = call(f'{B}/recommendations/v1/papers/forpaper/arXiv:{i}?limit=10&fields=externalIds,title,year,publicationDate')
              print('recs', i, code)
              if code == 200:
                  for r in j.get('recommendedPapers', [])[:10]:
                      print('   ', (r.get('externalIds') or {}).get('ArXiv'), r.get('publicationDate'), (r.get('title') or '')[:70])
              else:
                  print('   ', j)
              time.sleep(1.5)
          code, j = call(f'{B}/graph/v1/paper/arXiv:2609.18487?fields=title', use_key=False)
          print('no-key single lookup:', code)
